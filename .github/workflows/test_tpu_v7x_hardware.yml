name: TPU v7x Hardware Tests (RBE Accelerated)

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

jobs:
  tpu-v7x-hardware:
    name: TPU v7x Hardware Execution (Ironwood Silicon)
    if: contains(github.event.pull_request.labels.*.name, 'run-rbe') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, tpu-v7x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Op Tests on Physical TPU v7x Silicon
        run: |
          bazel test --config=rbe --test_output=errors //tests:searchsorted_ops_test
