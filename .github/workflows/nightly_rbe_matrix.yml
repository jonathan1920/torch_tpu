# GitHub Actions Workflow: Milestone 2 - Nightly 24-Hour RBE Hardware TPU Matrix
name: Nightly RBE TPU Test Matrix

on:
  schedule:
    - cron: '0 2 * * *' # Runs at 2:00 AM UTC daily
  workflow_dispatch:

jobs:
  nightly-tpu-matrix:
    name: Nightly RBE TPU Matrix (${{ matrix.tpu_gen }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tpu_gen: [v5, v6e, v7x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP RBE
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_RBE_SERVICE_ACCOUNT_KEY }}

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@v0.8.0

      - name: Run RBE Matrix for TPU Generation ${{ matrix.tpu_gen }}
        run: |
          bazel test --config=rbe --test_tag_filters=requires-${{ matrix.tpu_gen }} --test_output=errors //...
