apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpu-v5e-github-runner
  namespace: actions-runner
  labels:
    app: tpu-v5e-github-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tpu-v5e-github-runner
  template:
    metadata:
      labels:
        app: tpu-v5e-github-runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v5e-pool
      containers:
      - name: runner
        image: gcr.io/rbe-tpu-oss/tpu-ci-runner@sha256:01702159dba5594e9e238f4c293a2872e15f350599c382d96078a87750b150e4
        command:
        - /bin/bash
        - -c
        - |
          set -e
          mkdir -p /actions-runner && cd /actions-runner
          if [ ! -f ./config.sh ]; then
            curl -o runner.tar.gz -L https://github.com/actions/runner/releases/download/v2.321.0/actions-runner-linux-x64-2.321.0.tar.gz
            tar xzf runner.tar.gz
          fi
          ./config.sh --url https://github.com/jonathan1920/torch_tpu --token "${RUNNER_TOKEN}" --labels tpu-v5,self-hosted,linux,x64 --unattended --replace
          ./run.sh
        env:
        - name: RUNNER_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-runner-secret
              key: runner-token
        resources:
          limits:
            google.com/tpu: "8"
          requests:
            google.com/tpu: "8"
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: runner-data
          mountPath: /actions-runner
        - name: tmp-volume
          mountPath: /tmp
        - name: home-volume
          mountPath: /home/runner
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: runner-data
        emptyDir: {}
      - name: tmp-volume
        emptyDir: {}
      - name: home-volume
        emptyDir: {}
